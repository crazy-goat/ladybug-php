name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIBLBUG_VERSION: '0.19.1'
  # Composer fetches dists from codeload.github.com, which rate-limits unauthenticated
  # requests hard enough to fail every job at once — it happened four times in one afternoon.
  # The automatic token needs no setup and raises the limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      # tests/Unit/ExtensionVersionTest.php reads CHANGELOG.md, so a change to it needs the
      # unit tests and must not count as docs-only. Other Markdown files are not read by tests.
      docs-regex: '^((README|CONTRIBUTING|AGENTS)\.md|docs/.*|LICENSE.*|\.github/ISSUE_TEMPLATE/.*|\.github/pull_request_template\.md|\.gitignore)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  # Setup only; every check lives in bin/lint.sh (php-cs-fixer, PHPStan, Rector, clang-format,
  # shellcheck, hadolint). One PHP version is enough — these tools do not vary across runtimes,
  # and the matrix below covers the code paths.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ffi, bcmath
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Fetch liblbug
        run: bash tools/fetch-liblbug.sh "$LIBLBUG_VERSION"

      # Pinned: the versions the image ships would change under us without a commit here.
      - name: Install clang-format, shellcheck and hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          PIPX_BIN_DIR="$HOME/.local/bin" pipx install clang-format==23.1.2
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          curl -fsSL -o "$HOME/.local/bin/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clang-format" --version
          "$HOME/.local/bin/shellcheck" --version
          "$HOME/.local/bin/hadolint" --version

      - name: Lint
        run: bin/lint.sh

  # The point of the two-connector design: the same integration suite has to pass on both
  # backends, on every supported runtime. A divergence in value conversion shows up here.
  test:
    name: php ${{ matrix.php }} / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, bcmath
          ini-values: ffi.enable=1
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Cache liblbug
        uses: actions/cache@v4
        with:
          path: lib
          key: liblbug-${{ env.LIBLBUG_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch liblbug
        run: |
          if [ ! -f lib/lbug.h ]; then
            bash tools/fetch-liblbug.sh "$LIBLBUG_VERSION"
          fi
          ls -l lib

      # No database required; runs against the fake connector.
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Integration tests — FFI connector
        run: LADYBUG_CONNECTOR=ffi vendor/bin/phpunit --testsuite integration

      - name: Build the native extension
        run: make ext

      - name: Integration tests — native extension
        run: make test-ext

      - name: Extension .phpt tests
        run: make ext-test

  # Coverage is measured across both backends and merged, because a single run reports the
  # other connector as dead code — neither number on its own describes the library.
  coverage:
    name: coverage (php 8.3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # A ratchet, not a target: set just below the current number and raised when it
      # improves. Guessing high only breaks unrelated pull requests.
      COVERAGE_MIN: '77'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, bcmath
          ini-values: ffi.enable=1
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Fetch liblbug
        run: bash tools/fetch-liblbug.sh "$LIBLBUG_VERSION"

      - name: Build the native extension
        run: make ext

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit --coverage-clover build/clover-unit.xml

      - name: Integration tests — FFI connector
        run: LADYBUG_CONNECTOR=ffi vendor/bin/phpunit --testsuite integration --coverage-clover build/clover-ffi.xml

      - name: Integration tests — native extension
        run: |
          LADYBUG_CONNECTOR=ext php -d extension="$PWD/ext/modules/ladybug.so" \
            vendor/bin/phpunit --testsuite integration --coverage-clover build/clover-ext.xml

      # Fails if a report has no <file> elements, so a missing coverage driver cannot pass
      # as "0% but above the floor".
      - name: Merge and check
        run: php tools/coverage-gate.php "$COVERAGE_MIN" build/clover-unit.xml build/clover-ffi.xml build/clover-ext.xml

  # The extension manages C resources by hand — handles pinned by refcount, parents freed
  # after children — and functional tests pass right up until the corruption surfaces
  # somewhere else entirely. (A close-ordering bug once showed up as an 8 TB mmap failure in
  # an unrelated test.) So the whole integration suite also runs against a poisoned heap.
  #
  # macOS, not Linux, and not by preference: on Linux PHP dlopens every extension with
  # RTLD_DEEPBIND, which the sanitizer runtime refuses to run alongside — including the
  # extension under test, so no distro PHP can host this without being rebuilt with ASan.
  # dyld has no such flag, so the same setup works there unchanged.
  sanitizer:
    name: AddressSanitizer (php 8.3, macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, bcmath
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Fetch liblbug
        run: bash tools/fetch-liblbug.sh "$LIBLBUG_VERSION"

      - name: Build the extension with AddressSanitizer
        run: make ext-asan

      # make test-asan refuses to run against an uninstrumented .so, so a silently
      # unsanitised pass is not possible here.
      - name: Integration suite under AddressSanitizer
        run: make test-asan

  # Static linking is a separate code path in config.m4 and a separate failure mode (the
  # C++ runtime has to be pulled in explicitly), so it gets its own job. The archive is
  # ~80 MB, which is why this is not part of the matrix.
  static-link:
    name: static liblbug (php 8.3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi, bcmath
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Fetch liblbug (static)
        run: bash tools/fetch-liblbug.sh "$LIBLBUG_VERSION" --static

      - name: Build with --enable-ladybug-static
        run: make ext-static

      - name: Assert the extension carries no liblbug dependency
        run: |
          if ldd ext/modules/ladybug.so | grep -i lbug; then
            echo "::error::the static build still links liblbug dynamically"
            exit 1
          fi
          ls -lh ext/modules/ladybug.so

      - name: Integration tests — native extension
        run: make test-ext

      - name: Extension .phpt tests
        run: make ext-test

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, test, coverage, sanitizer, static-link]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
